<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Measure Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F5F7;
    --ink:#12202A;
    --ink-soft:#3E5561;
    --accent:#2C6D93;
    --accent-strong:#1C4A66;
    --ua-red:#C6102B;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0D171E;
      --ink:#E9F1F5;
      --ink-soft:#A9BCC5;
      --accent:#6FB4DA;
      --accent-strong:#9ED0EC;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', system-ui, -apple-system, sans-serif;
    text-align:center;
    padding:24px;
  }
  .card{ max-width:520px; }
  h1{
    font-family:'Big Shoulders Display', system-ui, sans-serif;
    font-weight:800;
    text-transform:uppercase;
    font-size:clamp(32px,7vw,52px);
    margin:0 0 8px;
    line-height:1;
  }
  h1 em{ font-style:normal; color:var(--accent); }
  .eyebrow{
    font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ua-red); margin-bottom:14px;
  }
  p{ color:var(--ink-soft); font-size:16px; line-height:1.6; margin:16px 0 28px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:#fff; text-decoration:none;
    font-weight:600; font-size:15px;
    padding:13px 24px; border-radius:4px;
    transition:background .15s;
  }
  .btn:hover{ background:var(--accent-strong); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">University of Antwerp · Product Development</div>
    <h1>The Measure <em>Lab</em></h1>
    <p>This project's home is now the official University of Antwerp research page.</p>
    <a class="btn" href="https://www.uantwerpen.be/en/research-groups/product-development/research/measure-lab/">
      Visit the Measure Lab on uantwerpen.be →
    </a>
  </div>
</body>
</html>
